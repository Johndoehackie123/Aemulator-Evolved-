name: Build AEmulator Firmware Hub APK

on:
  workflow_dispatch:
  push:
    branches: [arena/f3a2b860-aemulator-evolved]
    paths-ignore:
      - 'artifacts/**'
      - '*.log'
      - '*.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: fork

      # The engine assets are ~500 MB and are not duplicated in this fork's source overlay.
      # Restore the exact pinned upstream revision and apply our changes on top of it.
      - name: Restore pinned upstream AEmulator source
        uses: actions/checkout@v4
        with:
          repository: uxazu/AEmulator
          ref: 3b97ed585e484395c455aca7338d7ddcbf955d9f
          path: upstream

      - name: Apply Firmware Hub overlay
        run: |
          cp -a fork/overlay/. upstream/
          # Stable signing identity: same key/certificate for every published build.
          mkdir -p upstream/signing
          cp fork/signing/aemulator-evolved.p12 upstream/signing/
          cp fork/signing/keystore.properties upstream/keystore.properties
          # Upstream ships a developer-specific Windows JDK path in gradle.properties.
          sed -i '/^org\.gradle\.java\.home=/d' upstream/gradle.properties
          # Give Kotlin enough heap/metaspace; upstream's default 768 MB caused OOM locally.
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' upstream/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > upstream/local.properties
          chmod +x upstream/gradlew
          diff -q fork/overlay/app/src/main/java/app/aemu/hub/FirmwareCatalog.kt upstream/app/src/main/java/app/aemu/hub/FirmwareCatalog.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run checksum/catalog unit tests and build arm64 debug APK
        working-directory: upstream
        run: |
          set +e
          rc=1
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --stacktrace \
              :app:testStandardDebugUnitTest \
              :app:assembleStandardDebug 2>&1 | tee ../fork/build-report.txt
            rc=${PIPESTATUS[0]}
            [ "$rc" -eq 0 ] && break
            echo "Gradle failed with $rc (attempt $attempt/3) - retrying after 30s"
            sleep 30
          done
          exit "$rc"

      - name: Save build report on failure
        if: failure()
        working-directory: fork
        run: |
          git config user.name "AEmulator build bot"
          git config user.email "build@example.com"
          git add -f build-report.txt || true
          git commit -m "CI: build failure report" || true
          git pull --rebase origin arena/f3a2b860-aemulator-evolved || true
          git push origin HEAD:arena/f3a2b860-aemulator-evolved || true

      - name: Record unit-test results
        if: always()
        run: |
          mkdir -p fork/artifacts
          {
            echo "Gradle build: $([ -f fork/build-report.txt ] && tail -1 fork/build-report.txt || echo 'see workflow log')"
            echo "Unit test suites (app/src/test):"
            grep -h '<testsuite' upstream/app/build/test-results/testStandardDebugUnitTest/*.xml 2>/dev/null || echo "no XML results found"
          } > fork/artifacts/unit-test-summary.txt
          cat fork/artifacts/unit-test-summary.txt

      - name: Collect signed/unsigned APK and checksum
        run: |
          set -e
          mkdir -p fork/artifacts
          apk=$(find upstream/app/build/outputs/apk/standard/debug -name '*.apk' -type f | head -1)
          test -n "$apk"
          cp "$apk" fork/artifacts/Aemulator-Evolved-standard-debug.apk
          cd fork/artifacts
          sha256sum Aemulator-Evolved-standard-debug.apk > Aemulator-Evolved-standard-debug.apk.sha256
          ls -lh Aemulator-Evolved-standard-debug.apk
          unzip -l Aemulator-Evolved-standard-debug.apk > APK-contents.txt
          echo "lib/arm64-v8a present:" && grep -c 'lib/arm64-v8a/' APK-contents.txt

      - name: Verify APK signing certificate
        run: |
          set -e
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          export PATH="$ANDROID_HOME/build-tools/$BT:$PATH"
          expected="$(tr -d '[:space:]' < fork/signing/CERTIFICATE_SHA256.txt | tr 'A-F' 'a-f')"
          apksigner verify --verbose --print-certs fork/artifacts/Aemulator-Evolved-standard-debug.apk 2>&1 \
            | tee fork/artifacts/signature.txt
          actual="$(sed -n 's/.*SHA-256 digest: //p' fork/artifacts/signature.txt | head -1 | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          echo "Expected signing certificate: $expected"
          echo "Actual signing certificate:   $actual"
          if [ -z "$actual" ]; then
            echo "apksigner reported no SHA-256 signer digest"
            grep -i -E 'signer|digest|error' fork/artifacts/signature.txt || true
            exit 1
          fi
          test "$actual" = "$expected" || { echo "APK signature does not match the pinned certificate"; exit 1; }

      - name: Publish APK into this branch for download
        working-directory: fork
        run: |
          git config user.name "AEmulator build bot"
          git config user.email "build@example.com"
          git add artifacts
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "CI: build arm64 Firmware Hub APK"
          git pull --rebase origin arena/f3a2b860-aemulator-evolved || true
          git push origin HEAD:arena/f3a2b860-aemulator-evolved

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aemulator-Evolved-arm64-debug
          path: |
            fork/artifacts/Aemulator-Evolved-standard-debug.apk
            fork/artifacts/Aemulator-Evolved-standard-debug.apk.sha256
            fork/artifacts/APK-contents.txt
            fork/artifacts/unit-test-summary.txt
            fork/artifacts/signature.txt
          if-no-files-found: error
          retention-days: 90
