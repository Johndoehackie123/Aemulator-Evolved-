name: Publish Firmware Hub release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v0.0.0.5-evolved"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          SHA=$(sha256sum artifacts/Aemulator-Evolved-standard-debug.apk | cut -d' ' -f1)
          {
            echo "AEmulator Evolved v0.0.0.5 - Firmware Hub build."
            echo ""
            echo "This GPL-3.0 fork is based on uxazu/AEmulator (pinned 3b97ed5) and the original SENSES emulator by Istratii-tech."
            echo "Repository: https://github.com/Johndoehackie123/Aemulator-Evolved-"
            echo "Package ID: app.aemu.evolved - installs side by side with upstream app.aemu."
            echo ""
            echo "Install: Aemulator-Evolved-standard-debug.apk (arm64-v8a, Android 8.0+/API 26)."
            echo "SHA-256: $SHA"
            echo ""
            echo "Included: firmware catalog, one-tap resumable downloads with checksum verification,"
            echo "import queue with auto-import for verified files, and ten Hub layouts (Cards, Compact,"
            echo "Grid, Mosaic, List, Timeline, Featured, Table, Carousel and Text only). Hub settings"
            echo "let you choose and reorder the details shown in each layout. The updater checks this repo."
            echo ""
            echo "8/8 unit tests passed. Not tested on a physical device."
          } > /tmp/release-notes.md
          gh release create "$TAG" --target main \
            --title "AEmulator Evolved v0.0.0.5" \
            --notes-file /tmp/release-notes.md \
            artifacts/Aemulator-Evolved-standard-debug.apk \
            artifacts/Aemulator-Evolved-standard-debug.apk.sha256
          gh release view "$TAG"
